<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мон-Шибасаки Агуулах — Санхүүгийн загвар · v02</title>
<style>
:root{
  --ink:#16181A; --mute:#82858B; --faint:#B4B7BC; --line:#EBE9E4; --bg:#FCFBF9;
  --navy:#2F4858; --rust:#B4713D; --red:#9C3D2E; --green:#2E6049; --sand:#C9BFA8; --blue:#8AA4B2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.018em}
button{font:inherit; cursor:pointer}
[data-ja],[data-cur]{cursor:help}
.wrap{max-width:1080px; margin:0 auto; padding:0 28px}
@media(max-width:640px){.wrap{padding:0 18px}}

/* header */
header{border-bottom:1px solid var(--line); background:#fff}
.hd{display:flex; align-items:center; gap:16px; padding:18px 0; flex-wrap:wrap}
.hd h1{font-size:17px}
.hd .sub{font-size:13px; color:var(--mute); margin-top:1px}
.spacer{flex:1}
.seg{display:flex; background:#F2F0EC; border-radius:9px; padding:3px}
.seg button{border:0; background:transparent; color:var(--mute); font-size:13px; font-weight:500;
  padding:6px 13px; border-radius:7px; white-space:nowrap}
.seg button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.07)}
.lnk{border:0; background:transparent; color:var(--mute); font-size:13px; padding:6px 4px}
.lnk:hover{color:var(--ink)}

/* sticky slider strip — sliders only */
.ctrl{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line)}
.cg{display:grid; grid-template-columns:repeat(6,1fr); gap:24px; padding:14px 0 12px}
@media(max-width:1000px){.cg{grid-template-columns:repeat(3,1fr); gap:18px}}
@media(max-width:620px){.cg{grid-template-columns:repeat(2,1fr)}}
.c .top{display:flex; justify-content:space-between; align-items:baseline; gap:6px}
.c .lab{font-size:11px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.c .val{font-size:13.5px; font-weight:600; white-space:nowrap}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:3px; margin:9px 0 0;
  border-radius:2px; background:#E4E1DA; outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--navy); border:2.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25); cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--navy);
  border:2.5px solid #fff; cursor:pointer}
.more{display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; gap:12px}
.more .hintbar{font-size:11.5px; color:var(--faint)}
.more button{border:1px solid var(--navy); background:var(--navy); color:#fff; font-size:12px;
  padding:6px 14px; border-radius:20px}
.more button:hover{background:#243844}

/* drawer */
.drawer{position:fixed; inset:0; z-index:100; display:none}
.drawer.open{display:block}
.backdrop{position:absolute; inset:0; background:rgba(22,24,26,.34); animation:fade .18s ease}
.panel{position:absolute; top:0; right:0; bottom:0; width:min(560px,100%); background:#FDFCFA;
  display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.14); animation:slide .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.phead{padding:18px 22px 0; border-bottom:1px solid var(--line); background:#fff}
.phead .r1{display:flex; align-items:center; gap:10px}
.phead h3{font-size:16px}
.xclose{margin-left:auto; width:32px; height:32px; border:1px solid var(--line); border-radius:8px;
  background:#fff; font-size:18px; line-height:1; color:var(--mute)}
.xclose:hover{color:var(--ink); border-color:var(--faint)}
.ptabs{display:flex; gap:2px; margin-top:14px; overflow-x:auto}
.ptabs button{border:0; background:transparent; padding:9px 12px; font-size:13px; color:var(--mute);
  border-bottom:2px solid transparent; white-space:nowrap}
.ptabs button.on{color:var(--ink); font-weight:600; border-bottom-color:var(--rust)}
.pbody{flex:1; overflow-y:auto; padding:18px 22px 60px; overscroll-behavior:contain}
.pane{display:none} .pane.on{display:block}
.grp{margin-bottom:24px}
.grp h4{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--rust);
  font-weight:700; margin:0 0 8px}
.preset{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
.preset button{border:1px solid var(--line); background:#fff; border-radius:11px; padding:12px 14px;
  text-align:left; transition:.12s}
.preset button b{display:block; font-size:14px}
.preset button span{font-size:11.5px; color:var(--mute)}
.preset button.on{border-color:var(--navy); box-shadow:0 0 0 1px var(--navy); background:#F5F8F9}
.f{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0}
.f label{font-size:12.8px; color:#4E5155; flex:1; min-width:0}
.f input[type=number]{width:108px; flex:none; height:30px; text-align:right; font:inherit; font-size:12.8px;
  border:1px solid var(--line); border-radius:7px; padding:0 8px; background:#fff; color:var(--ink)}
.f input[type=text]{flex:1; min-width:0; height:30px; font:inherit; font-size:12.8px;
  border:1px solid var(--line); border-radius:7px; padding:0 9px; background:#fff}
.f input:focus{outline:2px solid var(--navy); outline-offset:-1px}
.f select{height:30px; font:inherit; font-size:12.8px; border:1px solid var(--line); border-radius:7px;
  padding:0 5px; background:#fff; max-width:180px}
.sw,.f label.sw{position:relative; width:36px; height:20px; flex:none}
.sw input{position:absolute; opacity:0; width:0; height:0}
.sw i{position:absolute; inset:0; background:#DBD8D1; border-radius:20px; transition:.16s; cursor:pointer}
.sw i::after{content:""; position:absolute; width:14px; height:14px; top:3px; left:3px; background:#fff;
  border-radius:50%; transition:.16s}
.sw input:checked + i{background:var(--green)}
.sw input:checked + i::after{transform:translateX(16px)}
.stf{border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:8px; background:#fff}
.stf .r{display:flex; gap:7px; margin-bottom:4px}
.xb{width:30px; height:30px; flex:none; border:1px solid var(--line); background:#fff; border-radius:7px;
  color:var(--red); font-size:14px; line-height:1}
.xb:hover{background:#FDF3F1}
.addb{width:100%; padding:8px; font-size:12.5px; color:var(--rust); background:#fff;
  border:1px dashed #E0D3BE; border-radius:8px}
.addb:hover{background:#FFFBF4}
.note{font-size:11.8px; color:var(--mute); margin-top:8px; line-height:1.55; background:#F4F2EC;
  border-radius:8px;
padding:7px 10px}
.note b{color:var(--ink)}

/* body */
section{padding:52px 0 0}
.eyebrow{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--rust); font-weight:700}
section h2{font-size:23px; margin:7px 0 4px}
.lede{font-size:14px; color:var(--mute); max-width:700px; line-height:1.6}
.figcap{font-size:12px; color:var(--mute); margin-top:12px; font-style:italic}
.kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:13px; overflow:hidden; margin-top:24px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.k{background:#fff; padding:17px 18px}
.k .v{font-size:25px; font-weight:600; letter-spacing:-.03em; line-height:1.15}
.k .l{font-size:11.5px; color:var(--mute); margin-top:4px}
.k.good .v{color:var(--green)} .k.bad .v{color:var(--red)} .k.warn .v{color:#A8741A}
.k .s{font-size:11.5px; color:var(--mute); margin-top:3px; line-height:1.45}
.kpis.two{grid-template-columns:repeat(2,1fr); margin-top:12px}
@media(max-width:700px){.kpis.two{grid-template-columns:1fr}}
.vd{display:flex; gap:13px; align-items:flex-start; margin-top:22px; padding:19px 21px;
  border-radius:13px; border:1px solid var(--line); background:#fff}
.vd.no{border-color:#EBD3CC; background:#FDF6F4}
.vd .dot{width:9px; height:9px; border-radius:50%; margin-top:7px; flex:none; background:var(--green)}
.vd.no .dot{background:var(--red)}
.vd h3{font-size:15px; margin-bottom:5px}
.vd.no h3{color:#7E2F22}
.vd p{margin:0; font-size:13.5px; line-height:1.75; color:#55585C}
.vd.no p{color:#6E3428}
.vd b{color:var(--ink)} .vd.no b{color:#5A241A}
.fig{margin-top:26px}
svg{display:block; width:100%; height:auto; overflow:visible}
.lg{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--mute)}
.lg i{display:inline-block; width:10px; height:10px; border-radius:2.5px; margin-right:7px; vertical-align:-1px}
.tbl{margin-top:22px; overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px}
caption{text-align:left; font-size:13px; font-weight:600; padding-bottom:11px; color:var(--ink)}
th{font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--mute); font-weight:600;
  text-align:right; padding:0 0 9px 16px; border-bottom:1px solid var(--ink); white-space:nowrap}
th:first-child{text-align:left; padding-left:0}
td{text-align:right; padding:9px 0 9px 16px; border-bottom:1px solid var(--line); white-space:nowrap}
td:first-child{text-align:left; padding-left:0; color:#4E5155}
tr.hl td{background:#F7F5F1; font-weight:600}
tr.hl td:first-child{color:var(--ink)}
.neg{color:var(--red); font-weight:600} .pos{color:var(--green); font-weight:600}
.sm{font-size:12px} .sm td,.sm th{padding-left:13px}

/* formulas */
.fstep{display:flex; align-items:baseline; gap:12px; margin:36px 0 4px}
.fstep .n{width:26px; height:26px; flex:none; border-radius:50%; background:var(--navy); color:#fff;
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; transform:translateY(4px)}
.fstep h3{font-size:17px}
.fcards{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:14px}
@media(max-width:820px){.fcards{grid-template-columns:1fr}}
.fc{background:#fff; border:1px solid var(--line); border-radius:13px; padding:17px 19px}
.fc h4{font-size:13.8px; margin:0 0 8px}
.fc .fx{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.3px; line-height:1.75;
  background:#F7F5F1; border:1px solid var(--line); border-radius:8px; padding:10px 13px; white-space:pre-wrap;
  color:#23303A}
.fc .fx b{color:var(--rust); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{font-size:11.5px; padding:3px 9px; border-radius:20px; background:#EEF3F5; color:#2F4858;
  border:1px solid #DCE6EA; white-space:nowrap}
.chip.dn{background:#FBF0EC; color:#8A3526; border-color:#F0D9D1}
.fc .exp{font-size:12.6px; color:#55585C; margin-top:10px; line-height:1.62}
.fc .live{font-size:12px; color:var(--mute); margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); line-height:1.6}
.fc .live b{color:var(--green); font-weight:600}
footer{margin:60px 0 40px; padding-top:20px; border-top:1px solid var(--line);
  font-size:12px; color:var(--faint); line-height:1.7}

/* tooltip */
#tip{position:fixed; z-index:300; max-width:320px; background:#1F2A31; color:#fff; font-size:12.5px; line-height:1.6;
  padding:8px 11px; border-radius:8px; pointer-events:none; opacity:0; transition:opacity .1s; white-space:pre-line;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  box-shadow:0 6px 18px rgba(0,0,0,.2)}
#tip.on{opacity:1}
#tip .jl{font-size:10px; letter-spacing:.1em; color:#C9BFA8; display:block; margin-bottom:2px}
#tip .en{display:block; margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,.18);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#tip .el{font-size:10px; letter-spacing:.1em; color:#8AA4B2; display:block; margin-bottom:2px}

/* validation notes, change markers, toast, changelog */
.warns{display:grid; gap:6px; margin:0 0 18px}
.wn{font-size:12.8px; line-height:1.5; padding:8px 12px; border-radius:9px; border:1px solid #EAD9B5; background:#FFFAEE; color:#6B5219}
.wn.err{border-color:#EBD3CC; background:#FDF6F4; color:#7E2F22}
.wn b{display:inline-block; width:16px; font-weight:700}
#dWarn:not(:empty){margin-bottom:18px}
.f .rs{width:22px; height:22px; flex:none; border:0; background:transparent; color:var(--rust); font-size:14px; line-height:1; padding:0; visibility:hidden}
.f.chg .rs{visibility:visible}
.f.chg > label:first-child::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--rust); margin-right:6px; vertical-align:1px}
.f.ref > label:first-child{color:var(--faint)}
.hid{display:none!important}
.xs{border-left:2px solid #E0D3BE; padding-left:10px; margin:10px 0 14px}
.xs.off{opacity:.5}
.f:not(.ref) .reftag{display:none}
.xnote{border:1px solid #E0D3BE; background:#FFFBF4; border-radius:12px; padding:12px 16px; margin:0 0 18px; font-size:13px; color:#55585C}
.xnote b{color:var(--ink)}
.xnote table{margin-top:8px; max-width:520px}
.xtag{font-size:10.5px; color:var(--rust); background:#FBF3E8; border:1px solid #EFDDC2; border-radius:20px; padding:1px 8px}
.chgc{font-size:11px; color:var(--rust); background:#FBF3E8; border:1px solid #EFDDC2; border-radius:20px; padding:1px 9px}
.chgc:empty{display:none}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:400; background:#1F2A31; color:#fff;
  font-size:12.5px; padding:9px 16px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s}
#toast.on{opacity:1}
details.cl{margin-top:10px} details.cl summary{cursor:pointer; color:var(--mute)} details.cl ul{margin:6px 0 0; padding-left:18px}

@media print{.ctrl,.drawer,.lnk,.more,.seg,#tip,#toast,.rs,.chgc{display:none!important}
  section{padding-top:30px; break-inside:avoid} body{background:#fff}}
</style>
</head>
<body>

<header><div class="wrap hd">
  <div>
    <h1 data-ja="モンシバサキ倉庫センター" data-en="Mon-Shibasaki Warehouse">Мон-Шибасаки Агуулах</h1>
    <div class="sub" data-ja="財務モデル・ウランバートル" data-en="Financial model · Ulaanbaatar">Санхүүгийн загвар · Улаанбаатар</div>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="seg"></div>
  <button class="lnk" id="bReset" data-ja="初期値に戻す" data-en="Reset to defaults">Сэргээх</button>
  <button class="lnk" id="bShare" data-ja="現在の入力内容を再現できるリンクをコピーします" data-en="Copy a link that reproduces your current inputs">Холбоос хуулах</button>
  <button class="lnk" id="bCsv" data-ja="CSVでダウンロード" data-en="Download as CSV">CSV татах</button>
  <button class="lnk" id="bPrint" data-ja="印刷" data-en="Print">Хэвлэх</button>
</div></header>

<div class="ctrl">
  <div class="wrap">
    <div class="cg" id="ctrl"></div>
    <div class="more">
      <span class="hintbar" id="hintbar"></span>
      <button id="bMore" data-ja="すべての前提条件を開く" data-en="Open all assumptions">Бүх үзүүлэлт ⚙</button>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <div class="panel" role="dialog" aria-label="Бүх үзүүлэлт">
    <div class="phead">
      <div class="r1">
        <h3 data-ja="すべての前提条件" data-en="All assumptions">Бүх үзүүлэлт</h3>
        <span class="chgc" id="chgCount" data-ja="初期値から変更した項目の数" data-en="Number of fields changed from defaults"></span>
        <button class="xclose" id="bClose" data-ja="閉じる（Escキー）" data-en="Close (Esc)">×</button>
      </div>
      <div class="ptabs" id="ptabs"></div>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<div class="wrap">
  <div id="modelBody"></div>
  <div id="formulasBody"></div>
</div>

<div id="tip"></div>
<div id="toast"></div>

<script>
"use strict";
/* ═════════ CONSTANTS ═════════ */
const OPEX_KEYS=['maintenance','security','insurance','marketing','administration','accounting',
  'internet','software','cleaning','repairs','misc','management','heating','electricity','water'];
const OPEX_LBL={
  maintenance:['Засвар үйлчилгээ','維持管理費','Maintenance'], security:['Хамгаалалт','警備費','Security'], insurance:['Даатгал','保険料','Insurance'],
  marketing:['Маркетинг','マーケティング費','Marketing'], administration:['Удирдлага','管理費','Administration'], accounting:['Нягтлан бодох','会計費','Accounting'],
  internet:['Интернэт','インターネット','Internet'], software:['Программ хангамж','ソフトウェア','Software'], cleaning:['Цэвэрлэгээ','清掃費','Cleaning'],
  repairs:['Их засвар','修繕費','Major repairs'], misc:['Бусад','その他','Other'], management:['Барилгын менежмент','建物管理費','Building management'],
  heating:['Халаалт','暖房費','Heating'], electricity:['Цахилгаан','電気代','Electricity'], water:['Ус','水道代','Water']};
const UTIL={heating:1,electricity:1,water:1};
const INF_OF={maintenance:'maintenanceInflation',insurance:'insuranceInflation',marketing:'marketingInflation',
  heating:'utilitiesInflation',electricity:'utilitiesInflation',water:'utilitiesInflation'};
const INF_ALL=['salaryGrowth','maintenanceInflation','insuranceInflation','marketingInflation','utilitiesInflation','otherOpexInflation'];
function ox(m,a){const o={};OPEX_KEYS.forEach(k=>o[k]=0);o.maintenance=m;o.administration=a;
  o.heating=40;o.electricity=8;o.water=2;return o;}
/* Base-plan presets: 1 floor = Option A, 2 floors = Option B */
const PRESETS={
  A:{name:'Хувилбар А · 1 давхар',ground:600,second:0,construction:55,contingency:0,
     fitout:0,equipment:0,constructionMonths:7,openingYear:2027,loanAmount:55,
     staff:[{name:'Менежер',count:1,salary:2500000,burden:0,bonusMonths:0},
            {name:'Агуулахын ажилтан',count:1,salary:2500000,burden:0,bonusMonths:0}],
     opex:ox(8.6,20), tenantPaid:{heating:true,electricity:true,water:true}},
  B:{name:'Хувилбар Б · 2 давхар',ground:600,second:450,construction:90,contingency:0,
     fitout:0,equipment:0,constructionMonths:7,openingYear:2027,loanAmount:90,
     staff:[{name:'Менежер',count:1,salary:2500000,burden:0,bonusMonths:0},
            {name:'Агуулахын ажилтан',count:2,salary:1875000,burden:0,bonusMonths:0}],
     opex:ox(17.3,20), tenantPaid:{heating:true,electricity:true,water:true}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const DEF={
  preset:'B', base:'B',
  ext:false, extValue:false, valueGrowth:0, extTax:false, lossYears:2, extBuild:false, drawdown:50,
  horizon:20, roiYears:0, includeTerminal:false, terminalPct:100, landValue:3,
  fx:23, simulateFx:false, fxDep:0,
  rent:40000, vat:10, vatInclusive:true, occupancy:75, rentablePct:100,
  rampYears:0, rampStart:50, rentFreeMonths:0,
  yearsFixed:3, reviewEvery:3, rentAdjustment:15, maxRentIncrease:15,
  otherMonthlyIncome:0, otherIncomeGrowth:0, badDebt:0, avgTenantArea:30,
  cit:10, propertyTax:1, propertyTaxBase:'construction',
  interestDeductible:true, depreciation:false, usefulLife:30,
  salaryGrowth:9, maintenanceInflation:9, insuranceInflation:9, marketingInflation:9,
  utilitiesInflation:9, otherOpexInflation:9,
  sensMin:25000, sensStep:5000,
  loan:{rate:3,term:15,startYear:1,graceYears:0,interestOnlyYears:0,fee:0,balloon:0,method:'annuity'},
  sc:clone(PRESETS.B)

  document.querySelectorAll('#pbody .f').forEach(f=>{
    const el=f.querySelector('[data-p]'); if(!el) return;
    constc=isChanged(el.dataset.p); f.classList.toggle('chg',c); if(c) n++;
  });
  const b=document.getElementById('chgCount'); if(b) b.textContent=n?n+' өөрчлөлт':'';
}
const grp=(mn,ja,body)=>`<div class="grp"><h4 ${jaAttr(ja)}>${mn}</h4>${body}</div>`;
const live=k=>`<span data-live="${k}"></span>`;

function drawTabs(){
  document.getElementById('ptabs').innerHTML=TABS.map(([k,mn,ja])=>
    `<button data-tab="${k}" ${jaAttr(ja)} class="${activeTab===k?'on':''}">${mn}</button>`).join('');
}
